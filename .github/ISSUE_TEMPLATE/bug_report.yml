name: Bug report
description: Report a reproducible problem in the scanner, the skill, or the docs.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a vulnerability in the scanner itself, follow SECURITY.md and report
        privately. Never paste a real secret, private key, or personal data here.
        Replace any secret-looking value with `REDACTED`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      options:
        - Scanner (scripts/scan.py)
        - A detector (scripts/detectors/)
        - Skill instructions (SKILL.md)
        - Tests
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What went wrong?
      placeholder: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
      placeholder: "1. Run scan.py on ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and version
      description: Scanner version, Python version, operating system, and whether git was used.
      placeholder: "secret-scanner 0.1.0; Python 3.12; macOS; git not used"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Optional. Paste the report with every secret-looking value replaced by REDACTED.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Optional. Remove secrets and personal data before attaching files.
    validations:
      required: false
